<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadlock Visualisation and Recovery Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#graph" class="skip-link">Skip to graph</a>
  <div class="app-container">
    <header class="app-header">
      <h1>Deadlock Visualisation and Recovery Simulator</h1>
    </header>

    <main class="main-area">
      <section id="configure-panel" class="panel">
        <div class="panel-header"><h2>Configure Scenario</h2></div>
        <div class="panel-content"></div>
      </section>

      <div class="graph-column">
        <section id="graph" class="graph-region" tabindex="-1" aria-label="Resource Allocation Graph">
          <div class="graph-canvas" aria-label="Graph display area">
            <p class="placeholder-text">Graph visualization will be rendered here.</p>
          </div>
        </section>
        <div class="graph-caption">Resource Allocation Graph</div>
      </div>

      <aside class="side-column">
        <div class="side-col side-col-1">
          <section id="action-panel" class="panel">
            <div class="panel-header">
              <h2>Actions</h2>
            </div>
            <div class="panel-content"></div>
          </section>

          <section id="process-panel" class="panel">
            <div class="panel-header">
              <h2>Processes</h2>
            </div>
            <div class="panel-content">
              <p class="placeholder-text">No processes loaded.</p>
            </div>
          </section>

          <section id="resource-panel" class="panel">
            <div class="panel-header">
              <h2>Resources</h2>
            </div>
            <div class="panel-content">
              <p class="placeholder-text">No resources loaded.</p>
            </div>
          </section>
        </div>

        <div class="side-col side-col-2">
          <section id="detect-recover-panel" class="panel">
            <div class="panel-header">
              <h2>Detect and Recover</h2>
            </div>
            <div class="panel-content"></div>
          </section>

          <section id="history-section" class="panel">
            <div class="panel-header">
              <h2>Event History</h2>
              <div class="history-controls">
                <button type="button" id="btn-step-back">Step back</button>
                <button type="button" id="btn-step-forward">Step forward</button>
              </div>
            </div>
            <div id="history-panel" class="panel-content">
              <p class="placeholder-text">No events recorded yet.</p>
            </div>
          </section>
        </div>
      </aside>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    (function () {
      let idCounter = 1;
      function linkAllLabels() {
        const controls = document.querySelectorAll('input, select, textarea');
        controls.forEach(function (ctrl) {
          let label = ctrl.closest('label');
          if (!label && ctrl.id) {
            label = document.querySelector('label[for="' + ctrl.id + '"]');
          }
          if (label) {
            if (!ctrl.id) {
              ctrl.id = 'ctrl-auto-' + (idCounter++);
            }
            if (label.htmlFor !== ctrl.id) {
              label.htmlFor = ctrl.id;
            }
          }
        });
      }
      const observer = new MutationObserver(linkAllLabels);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('DOMContentLoaded', linkAllLabels);
    })();
  </script>
</body>
</html>
